<meta property="og:title" content="政局×マーケット日報">

<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a trading-desk daily sheet. Sticky date rail on top, then one scanning column:
   numbers first, then causes, then the slow-moving power structure, then what to watch. */
:root{
  --bg:#0A1128; --bg2:#0E1838; --surface:#121E45; --surface2:#19285A; --line:#283C76;
  --ink:#EEF2FA; --ink2:#B7C3E0; --ink3:#8696BD;
  --gold:#D4AF37; --gold-soft:#F0DFA0; --cyan:#00E5FF;
  --up:#FF8090; --down:#73B6FF; --warn:#FF5C77; --on-accent:#0A1128;
  --seat-g1:#D4AF37; --seat-g2:#F0DFA0; --seat-o1:#00E5FF; --seat-o2:#2FA9C4; --seat-o3:#A8EEF5;
  --seat-o4:#8FA3CC; --seat-o5:#5E6E99; --seat-o6:#C9D3EA; --seat-x:#3A4874; --on-seat:#0A1128;
  --f-display:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
  --f-num:'Oswald','Arial Narrow',Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EDF0F7; --bg2:#E2E7F2; --surface:#FBFCFE; --surface2:#F0F3FA; --line:#C7D0E5;
    --ink:#0A1128; --ink2:#3A4A73; --ink3:#5D6C94;
    --gold:#8A6808; --gold-soft:#A27C12; --cyan:#00697A;
    --up:#C2203A; --down:#1A5CC0; --warn:#C2203A; --on-accent:#FFFDF4;
    --seat-g1:#C9A227; --seat-g2:#E8D48F; --seat-o1:#22BFD6; --seat-o2:#2D97B0; --seat-o3:#A5E0E9;
    --seat-o4:#8FA3CC; --seat-o5:#6E7EA8; --seat-o6:#BCC7E0; --seat-x:#9BA6C2; --on-seat:#0A1128;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EDF0F7; --bg2:#E2E7F2; --surface:#FBFCFE; --surface2:#F0F3FA; --line:#C7D0E5;
  --ink:#0A1128; --ink2:#3A4A73; --ink3:#5D6C94;
  --gold:#8A6808; --gold-soft:#A27C12; --cyan:#00697A;
  --up:#C2203A; --down:#1A5CC0; --warn:#C2203A; --on-accent:#FFFDF4;
  --seat-g1:#C9A227; --seat-g2:#E8D48F; --seat-o1:#22BFD6; --seat-o2:#2D97B0; --seat-o3:#A5E0E9;
  --seat-o4:#8FA3CC; --seat-o5:#6E7EA8; --seat-o6:#BCC7E0; --seat-x:#9BA6C2; --on-seat:#0A1128;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--cyan);text-underline-offset:3px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin-inline:auto;padding-inline:20px;padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:baseline;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.02em;white-space:nowrap}
.brand span{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:700;white-space:nowrap}
.datenav{display:flex;gap:6px;align-items:center}
.datenav button{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:40px;height:38px;cursor:pointer;font-size:16px}
.datenav button:disabled{opacity:.35;cursor:default}
.datenav button:not(:disabled):hover{border-color:var(--gold)}
.datenav select{background:var(--surface);border:1px solid var(--line);border-radius:8px;height:38px;padding-inline:10px;max-width:60vw;font-variant-numeric:tabular-nums}
.secnav{max-width:1120px;margin-inline:auto;padding-inline:20px;overflow-x:auto;scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.secnav ul{display:flex;gap:4px;padding-block:0 8px;white-space:nowrap}
.secnav a{display:block;padding:4px 10px;border-radius:999px;font-size:13px;color:var(--ink2);text-decoration:none}
.secnav a:hover{color:var(--ink);background:var(--surface)}

.wrap{max-width:1120px;margin-inline:auto;padding-inline:20px;padding-block:28px 64px;display:flex;flex-direction:column;gap:44px}
section{display:flex;flex-direction:column;gap:16px;scroll-margin-top:110px}
.sec-head{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px}
.sec-head h2{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.3;text-wrap:balance}
.sec-head p{font-size:13px;color:var(--ink3)}

.mast{gap:14px}
.mast-meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--ink2)}
.mast-date{font-family:var(--f-num);font-size:20px;letter-spacing:.04em;color:var(--gold);font-weight:600}
.badge{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--gold);color:var(--gold)}
.badge.prov{border-color:var(--warn);color:var(--warn)}
.mast h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,46px);line-height:1.25;text-wrap:balance;max-width:22em}
.lede{font-size:16px;color:var(--ink2);max-width:44em}
.takes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.takes li{padding:14px 18px;display:flex;gap:12px;align-items:baseline;border-top:1px solid var(--line);margin-top:-1px;border-left:1px solid var(--line);margin-left:-1px;min-width:0}
.takes .n{font-family:var(--f-num);font-size:26px;line-height:1;color:var(--gold);font-weight:600}
.takes p{font-size:14px;line-height:1.6;min-width:0}
.notice{border:1px solid var(--warn);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink)}
.notice b{color:var(--warn)}

.tiles{display:flex;flex-wrap:wrap;gap:12px}
.tile{flex:1 1 300px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile .lab{font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.04em}
.tile .val{font-family:var(--f-num);font-weight:600;font-size:clamp(25px,6.4vw,36px);line-height:1.15;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 5px}
.tile .val span{white-space:nowrap}
.tile .val small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--ink2)}
@media (max-width:640px){.tile{flex-basis:150px;padding:12px 14px}}
.tile .chg{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--ink2)}
.tile .asof{font-size:11.5px;color:var(--ink3)}
.tile .note{font-size:12.5px;color:var(--ink2);line-height:1.55}
.tile svg{display:block;width:100%;height:36px;margin-top:4px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:17px;line-height:1.45;font-weight:700;text-wrap:balance}
.card p{font-size:14px;color:var(--ink2)}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--cyan)}
.driver{border-top:3px solid var(--gold)}
.driver .no{font-family:var(--f-num);font-size:28px;line-height:1;color:var(--gold);font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:var(--gold);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-accent);font-weight:700}
.news{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.news li{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 16px;padding:14px 18px;border-top:1px solid var(--line)}
.news li:first-child{border-top:none}
.news .cat{font-size:12px;font-weight:700;color:var(--gold);padding-top:3px}
.news h3{font-size:15.5px;line-height:1.5;font-weight:700}
.news p{font-size:13.5px;color:var(--ink2)}
.news .foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px;font-size:12px;color:var(--ink3)}
.pill{display:inline-block;border:1px solid var(--ink3);border-radius:4px;padding:0 7px;font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.7}
.pill.yen{border-color:var(--gold);color:var(--gold)} .pill.eq{border-color:var(--cyan);color:var(--cyan)}
@media (max-width:560px){.news li{grid-template-columns:minmax(0,1fr)}}

.rate{font-family:var(--f-num);font-weight:600;font-size:clamp(34px,6vw,52px);line-height:1.1;font-variant-numeric:tabular-nums}
.facts{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2)}
.facts li{padding-left:14px;position:relative}
.facts li::before{content:"";position:absolute;left:0;top:.8em;width:6px;height:2px;background:var(--gold)}
.vote{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;padding-top:6px;border-top:1px solid var(--line)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;background:var(--gold)}
.dot.no{background:transparent;border:2.5px solid var(--cyan)}
.vote p{font-size:12.5px;color:var(--ink2)}

.roles{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.roles dt{color:var(--ink3);font-size:12.5px;padding-top:2px}
.roles dd{font-weight:700;text-align:right}
.house{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.house-top{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.house-top h3{font-family:var(--f-display);font-size:20px;font-weight:700}
.house-top p{font-size:14.5px;font-weight:700;color:var(--gold)}
.seatbar{position:relative;padding-top:26px}
.segs{display:flex;height:44px;border-radius:8px;overflow:hidden}
.seg{min-width:0;display:flex;align-items:center;overflow:hidden}
.seg span{font-size:12.5px;font-weight:700;color:var(--on-seat);padding-left:10px;white-space:nowrap}
.mark{position:absolute;top:18px;bottom:-4px;width:0;border-left:2px dashed var(--ink)}
.mark span{position:absolute;top:-20px;font-size:11.5px;font-weight:700;white-space:nowrap;color:var(--ink)}
.mark.l span{right:5px} .mark.r span{left:5px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink2)}
.legend li{display:flex;gap:6px;align-items:center}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.house .note{font-size:13.5px;color:var(--ink2)}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);padding-left:16px;gap:10px}
.tl li{display:grid;grid-template-columns:88px minmax(0,1fr);gap:2px 12px;font-size:14px}
.tl .d{font-family:var(--f-num);color:var(--cyan);font-weight:600;font-size:15px}
@media (max-width:480px){.tl li{grid-template-columns:minmax(0,1fr)}}

.flow{display:flex;flex-direction:column;gap:10px}
.flow li{display:flex;gap:10px;align-items:stretch}
.flow .box{flex:1 1 0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.55}
.flow .box.from{border-left:4px solid var(--gold);font-weight:700}
.flow .box.to{border-left:4px solid var(--cyan);font-weight:700}
.flow .ar{flex:none;align-self:center;color:var(--gold);font-weight:700}
.flow .ar::before{content:"→"}
@media (max-width:680px){.flow li{flex-direction:column;gap:2px}.flow .ar::before{content:"↓"}.flow li + li{margin-top:8px}}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:10px 14px;border-top:1px solid var(--line);line-height:1.6}
thead th{border-top:none;font-size:12.5px;background:var(--surface2);white-space:nowrap}
th.w{color:var(--gold)} th.s{color:var(--cyan)}
tbody th{font-weight:700;white-space:nowrap}
td{color:var(--ink2)}

.cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px 14px}
.cal li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.cal .d{font-family:var(--f-num);font-size:17px;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
.cal p{font-size:14px;line-height:1.55}
.cal .k{font-size:11.5px;color:var(--ink3);font-weight:700;margin-right:6px}

.prose{display:flex;flex-direction:column;gap:20px;max-width:46em}
.prose h3{font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.5;margin-bottom:4px}
.prose p{font-size:15px;color:var(--ink2);line-height:1.9}
.prose .grp{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--cyan);padding-top:8px;border-top:1px solid var(--line)}

.src{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 24px;font-size:13px}
.src li{min-width:0;overflow-wrap:anywhere;color:var(--ink2)}
.foot{font-size:12.5px;color:var(--ink3);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:16px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:36px 24px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty h1{font-family:var(--f-display);font-size:24px;font-weight:700}
.empty p{color:var(--ink2);max-width:40em}
.deck{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;font-weight:700}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><b>政局×マーケット日報</b><span>@SOHO DAILY</span></div>
    <div class="datenav">
      <button type="button" id="prevBtn" aria-label="前の日へ" disabled>‹</button>
      <label for="dateSel" hidden>表示する日付</label>
      <select id="dateSel" aria-label="表示する日付" disabled><option>読み込み中</option></select>
      <button type="button" id="nextBtn" aria-label="次の日へ" disabled>›</button>
    </div>
  </div>
  <nav class="secnav" aria-label="セクション">
    <ul>
      <li><a href="#shikyo">市況</a></li>
      <li><a href="#zairyo">材料</a></li>
      <li><a href="#news">ニュース</a></li>
      <li><a href="#kinyu">金融政策</a></li>
      <li><a href="#kozo">政治構造</a></li>
      <li><a href="#keiro">伝達経路</a></li>
      <li><a href="#kakunin">確認ポイント</a></li>
      <li><a href="#nittei">日程</a></li>
      <li><a href="#kaisetsu">解説</a></li>
      <li><a href="#shutten">出典</a></li>
    </ul>
  </nav>
</header>

<main class="wrap" id="app">
  <div class="empty"><h1>きょうの分析を読み込んでいます</h1><p>市況、相場を動かした材料、政権と議会の構造、今後の日程がここに並びます。</p></div>
</main>
<script>
(function(){
'use strict';
var app=document.getElementById('app'), sel=document.getElementById('dateSel'),
    prevBtn=document.getElementById('prevBtn'), nextBtn=document.getElementById('nextBtn');
var st={db:'loading', list:[], structure:null, picked:null, filter:'すべて', sig:''};
var WD=['日','月','火','水','木','金','土'];

function S(v){return typeof v==='string'?v:(v==null?'':String(v));}
function A(v){return Array.isArray(v)?v:[];}
function O(v){return (v&&typeof v==='object'&&!Array.isArray(v))?v:{};}
function h(tag,attrs,kids){
  var e=document.createElement(tag),k;
  if(attrs){for(k in attrs){var v=attrs[k]; if(v==null||v===false)continue;
    if(k==='class')e.className=v; else if(k==='text')e.textContent=S(v); else e.setAttribute(k,v===true?'':v);}}
  [].concat(kids==null?[]:kids).forEach(function(c){ if(c==null||c===false)return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}
function safeUrl(u){return (typeof u==='string'&&/^https:\/\/[^\s"'<>]+$/.test(u))?u:null;}
function link(text,url){var u=safeUrl(url); return u?h('a',{href:u,target:'_blank',rel:'noopener noreferrer',text:text}):document.createTextNode(S(text));}
function validDate(d){return typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d);}
function jpDate(d){var p=d.split('-').map(Number); var w=new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay(); return p[0]+'年'+p[1]+'月'+p[2]+'日（'+WD[w]+'）';}
function shortDate(d){var p=d.split('-').map(Number); return p[1]+'月'+p[2]+'日';}
function todayJST(){return new Date(Date.now()+9*3600e3).toISOString().slice(0,10);}
function dayDiff(a,b){return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5);}
function stamp(iso){var t=Date.parse(S(iso)); if(isNaN(t))return ''; var j=new Date(t+9*3600e3);
  return (j.getUTCMonth()+1)+'月'+j.getUTCDate()+'日 '+('0'+j.getUTCHours()).slice(-2)+':'+('0'+j.getUTCMinutes()).slice(-2)+'（日本時間）';}
function secHead(title,sub){return h('div',{class:'sec-head'},[h('h2',{text:title}), sub?h('p',{text:sub}):null]);}
function current(){ if(!st.list.length)return null; var i; if(st.picked){for(i=0;i<st.list.length;i++) if(st.list[i].date===st.picked) return st.list[i];} return st.list[0]; }

/* ---------- pieces ---------- */
function spark(id,uptoDate){
  var pts=[]; st.list.forEach(function(e){ if(e.date>uptoDate||S(e.status)==='provisional')return;
    var v=O(e.nums)[id]; if(typeof v==='number'&&isFinite(v)) pts.push({d:e.date,v:v}); });
  pts.sort(function(a,b){return a.d<b.d?-1:1;}); pts=pts.slice(-30);
  if(pts.length<3)return null;
